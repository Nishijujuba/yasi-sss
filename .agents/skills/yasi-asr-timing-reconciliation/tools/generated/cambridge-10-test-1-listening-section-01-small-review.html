<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yasi Timing Review</title>
  <style>
    :root {
      --bg: #f5f7fa; --panel: #fff; --ink: #202a35; --muted: #657486;
      --line: #d8dee7; --blue: #155fbd; --green: #147a46; --red: #b42318;
      --amber: #9a5b00; --violet: #6741b8; --chip: #eef2f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.good { background: var(--green); border-color: var(--green); color: #fff; }
    button.warn { background: #fff7ed; border-color: #e3b66e; color: var(--amber); }
    button.danger { background: #fff1f0; border-color: #e4a19d; color: var(--red); }
    input, select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
    textarea { width: 100%; min-height: 90px; resize: vertical; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
    header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    .summary, .chips, .actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .pill, .chip { border-radius: 999px; background: var(--chip); color: var(--muted); padding: 3px 8px; font-size: 12px; white-space: nowrap; }
    .pill strong { color: var(--ink); }
    .chip.human-required, .pill.red { background: #fff0ef; color: var(--red); }
    .chip.llm-candidate { background: #f3edff; color: var(--violet); }
    .pill.green { background: #e8f5ee; color: var(--green); }
    .loader { background: #edf2f7; border-bottom: 1px solid var(--line); padding: 10px 18px; display: grid; grid-template-columns: 1fr 1fr 1.4fr auto; gap: 10px; align-items: end; }
    .loader label, .field { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
    main { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; min-height: 0; }
    aside { background: var(--panel); border-right: 1px solid var(--line); min-height: 0; display: grid; grid-template-rows: auto 1fr; }
    .filters { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 9px; }
    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .queue { overflow: auto; padding: 8px; }
    .queue-item { width: 100%; text-align: left; display: grid; gap: 5px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .queue-item.active { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
    .queue-title, .token-line { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
    .token-line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace { min-height: 0; overflow: auto; padding: 18px; display: grid; gap: 14px; align-content: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
    .panel h2 { margin: 0 0 10px; font-size: 16px; }
    .detail-grid, .time-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .time-grid { grid-template-columns: repeat(4, minmax(90px, 1fr)); }
    .value { border: 1px solid var(--line); border-radius: 6px; padding: 8px 9px; color: var(--ink); background: #fafbfc; overflow-wrap: anywhere; }
    .context { display: flex; gap: 6px; flex-wrap: wrap; }
    .word { border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 4px 7px; }
    .word.target { border-color: var(--blue); background: #eaf3ff; color: #0b4f9f; font-weight: 650; }
    .review-map { display: flex; gap: 5px; flex-wrap: wrap; max-height: 170px; overflow: auto; }
    .map-word { border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--ink); padding: 3px 5px; }
    .map-word.marker { border-color: var(--line); cursor: pointer; font-weight: 650; }
    .marker--human-required, .marker--needs-human, .marker--needs-auditory { background: #fff7ed; border-color: #e3b66e; color: var(--amber); }
    .marker--llm-candidate { background: #f3edff; border-color: #c7b7ff; color: var(--violet); }
    .marker--reject-evidence { background: #fff1f0; border-color: #e4a19d; color: var(--red); }
    .llm-box { background: #fbfaff; border: 1px solid #d8ccff; border-radius: 6px; margin-top: 12px; padding: 10px; }
    .llm-box b { color: var(--violet); }
    .audio-row { display: grid; grid-template-columns: minmax(260px, 1fr) auto auto auto; gap: 8px; align-items: center; }
    audio { width: 100%; min-width: 220px; }
    .empty { color: var(--muted); padding: 20px; text-align: center; }
    .footer-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 900px) {
      .loader, main, .detail-grid, .time-grid, .audio-row { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 46vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header><h1 id="title">Yasi Timing Review</h1><div id="summary" class="summary"></div></header>
    <section class="loader">
      <label>Review JSON <input id="reviewFile" type="file" accept="application/json,.json"></label>
      <label>Screening report <input id="reportFile" type="file" accept="application/json,.json"></label>
      <label>Audio URL <input id="audioUrl" type="text" placeholder="file:///D:/Project/yasi/.../section-01.mp3"></label>
      <button id="loadFiles" class="primary">Load</button>
    </section>
    <main>
      <aside>
        <div class="filters">
          <input id="search" type="search" placeholder="Search review id, token, reason">
          <div class="filter-row">
            <select id="tierFilter"><option value="unresolved">Unresolved</option><option value="human-required">Human required</option><option value="llm-candidate">LLM candidate</option><option value="all">All</option></select>
            <select id="riskFilter"><option value="">All risks</option></select>
          </div>
        </div>
        <div id="queue" class="queue"></div>
      </aside>
      <section class="workspace">
        <div class="panel">
          <h2>Timing Map</h2>
          <div id="reviewMap" class="review-map"></div>
        </div>
        <div id="detail" class="panel"></div>
        <div class="panel">
          <h2>Audio</h2>
          <div class="audio-row"><audio id="audio" controls preload="metadata"></audio><button id="playWindow">Play window</button><button id="setStart">Use current as start</button><button id="setEnd">Use current as end</button></div>
        </div>
        <div class="panel">
          <h2>Decision</h2>
          <div class="time-grid">
            <label class="field">Start <input id="startInput" type="number" step="0.001"></label>
            <label class="field">End <input id="endInput" type="number" step="0.001"></label>
            <label class="field">Reviewer <input id="reviewerInput" type="text" value="human-review-tool"></label>
            <label class="field">Decision <select id="decisionInput"><option value="pending">pending</option><option value="approved">approved</option><option value="corrected">corrected</option><option value="rejected">rejected</option></select></label>
          </div>
          <label class="field" style="margin-top:10px;">Notes <textarea id="notesInput"></textarea></label>
          <div class="actions" style="margin-top:10px;"><button id="approveButton" class="good">Approve timing</button><button id="correctButton" class="primary">Save correction</button><button id="pendingButton" class="warn">Keep pending</button><button id="rejectButton" class="danger">Reject</button></div>
        </div>
        <div class="footer-actions"><button id="exportButton" class="primary">Export reviewed JSON</button></div>
      </section>
    </main>
  </div>

    function renderDetail() { const i=item(); if (!i) { $("detail").innerHTML='<div class="empty">Load review data or select an item.</div>'; return; } const llm=i.screening?.llmSuggestion; const llmHtml=llm ? `<div class="llm-box"><b>Advisory LLM suggestion</b><div class="chips" style="margin-top:6px;"><span class="chip">${esc(llm.suggestedDecision)}</span><span class="chip">${esc(llm.preReviewLabel || "")}</span><span class="chip">${esc(num(llm.confidence))}</span></div><div class="value" style="margin-top:8px;">${esc(llm.notes || "")}</div>${llm.correction ? `<div class="value" style="margin-top:8px;">${esc(num(llm.correction.start))}-${esc(num(llm.correction.end))}</div>` : ""}</div>` : ""; $("detail").innerHTML=`<h2>${esc(i.reviewId)}</h2><div class="detail-grid"><div class="field"><label>Official token</label><div class="value">${esc(i.officialToken?.text)}</div></div><div class="field"><label>Whisper source</label><div class="value">${esc(i.sourceWord?.word || "missing")}</div></div><div class="field"><label>Match type</label><div class="value">${esc(i.matchType)}</div></div><div class="field"><label>Tier</label><div class="value">${esc(i.tier)}</div></div><div class="field"><label>Risks</label><div class="value">${esc(i.riskTypes.join(", ") || "none")}</div></div><div class="field"><label>Reasons</label><div class="value">${esc(i.reasons.join(", ") || "none")}</div></div></div>${llmHtml}<div class="field" style="margin-top:12px;"><label>Transcript context</label><div class="context">${(i.context||[]).map(w=>`<span class="word ${w.isTarget?"target":""}" title="${num(w.start)}-${num(w.end)}">${esc(w.token)}</span>`).join("") || '<span class="word">No context</span>'}</div></div>`; $("startInput").value=num(i.timing?.start); $("endInput").value=num(i.timing?.end); $("decisionInput").value=i.decision || "pending"; $("notesInput").value=reviewItem()?.notes || ""; }
    function updateReview(decision) { const raw=reviewItem(), i=item(); if (!raw || !i) return; const reviewer=$("reviewerInput").value.trim() || "human-review-tool", reviewedAt=new Date().toISOString().replace(/\.\d{3}Z$/,"Z"), start=Number($("startInput").value), end=Number($("endInput").value); raw.decision=decision; raw.reviewer=reviewer; raw.reviewedAt=reviewedAt; raw.notes=$("notesInput").value; raw.correction = decision==="corrected" ? {start,end,reviewer,reviewedAt,notes:raw.notes} : null; i.decision=decision; state.data.summary=summarize(flatten(state.data.reviewPayload), state.data.queueItems); render(); }
    function playWindow() { const i=item(), audio=$("audio"); if (!i || !audio.src) return; const start=Number(i.timing?.start), end=Number(i.timing?.end); if (!Number.isFinite(start) || !Number.isFinite(end)) return; audio.currentTime=Math.max(0,start-1.2); audio.play(); clearInterval(state.timer); state.timer=setInterval(()=>{ if (audio.currentTime >= end+1.2) { audio.pause(); clearInterval(state.timer); } }, 120); }
    function refreshStatuses(payload) { let unresolved=0; for (const s of payload.sections || []) { const pending=(s.mappingReviews || []).filter(i=>!done.has(i.decision)); unresolved += pending.length; s.status=pending.length?"pending":"reviewed"; } payload.status=unresolved?"needs-review":"reviewed"; }
    function exportReviewedJson() { if (!state.data?.reviewPayload) return; refreshStatuses(state.data.reviewPayload); const blob=new Blob([JSON.stringify(state.data.reviewPayload,null,2)+"\n"], {type:"application/json"}); const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download="alignment-review.reviewed.json"; a.click(); URL.revokeObjectURL(url); }
    function render() { if (!state.data) { renderSummary(); $("detail").innerHTML='<div class="empty">Load a screened review JSON to begin.</div>'; $("reviewMap").innerHTML='<div class="empty">No timing map loaded.</div>'; return; } $("title").textContent=state.data.title || "Yasi Timing Review"; $("audioUrl").value=state.data.audioUrl || $("audioUrl").value; $("audio").src=state.data.audioUrl || ""; renderSummary(); renderRisks(); renderQueue(); renderReviewMap(); renderDetail(); }
    $("loadFiles").onclick=loadFiles; $("search").oninput=render; $("tierFilter").onchange=render; $("riskFilter").onchange=render; $("playWindow").onclick=playWindow; $("setStart").onclick=()=>{$("startInput").value=$("audio").currentTime.toFixed(3);}; $("setEnd").onclick=()=>{$("endInput").value=$("audio").currentTime.toFixed(3);}; $("approveButton").onclick=()=>updateReview("approved"); $("correctButton").onclick=()=>updateReview("corrected"); $("pendingButton").onclick=()=>updateReview("pending"); $("rejectButton").onclick=()=>updateReview("rejected"); $("exportButton").onclick=exportReviewedJson;
    render();
  </script>
</body>
</html>
